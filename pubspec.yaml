name: attendqr
description: AttendQR Enterprise - QR-based Attendance Management System
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.2.1
  csv: ^5.1.1
  file_saver: ^0.2.10
  file_picker: ^8.0.0
  excel: ^4.0.0
  pdf: ^3.11.0
  printing: ^5.11.1
  flutter_local_notifications: ^17.2.1
  

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3        # for scanning QR on mobile

  # Charts
  fl_chart: ^0.68.0

  # Location / Geo-fencing
  flutter_map: ^7.0.2
  flutter_map_cancellable_tile_provider: ^3.0.2
  geolocator: ^14.0.2
  latlong2: ^0.9.1
  permission_handler: ^11.3.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  cupertino_icons: ^1.0.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  intl: ^0.19.0  
  image_picker: ^1.2.1
  http: ^1.2.2
  url_launcher: ^6.2.6
  flutter_launcher_icons: ^0.14.4
  go_router: ^17.2.3
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/download.png
    - assets/scan.png
    - assets/scan1.png
    - assets/scan2.png

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins-ExtraBold.ttf
          weight: 800
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  remove_alpha_ios: true
  image_path: "assets/download.png"
  adaptive_icon_background: "#0A8FF0"
  adaptive_icon_foreground: "assets/download.png"
